[package]
name = "toargv"
description = "Expand TOML and JSON configuration values into argument templates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/toargv"
readme = "../../README.md"
keywords = ["cli", "configuration", "arguments", "template", "toml"]
categories = ["command-line-utilities", "config"]

[dependencies]
toargv-template.workspace = true
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"
thiserror = "2.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"
